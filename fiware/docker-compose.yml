# FIWARE stack for Optimus telemetry (see README.md):
#   app (Android) ──POST──▶ api ──▶ Orion ──subscription──▶ QuantumLeap ──▶ CrateDB ◀── api ◀── dashboard
#                                                                                   ◀── Grafana
# On Linux hosts CrateDB needs: sudo sysctl -w vm.max_map_count=262144
name: optimus-fiware

services:
  # Microservice: telemetry API, video signaling WebSocket and dashboard. The only service exposed to the internet.
  api:
    build:
      context: ..
      dockerfile: fiware/api/Dockerfile
    container_name: optimus-api
    depends_on:
      - orion
      - crate-db
    environment:
      - API_KEY=${API_KEY:?set API_KEY in fiware/.env}
      - ORION_URL=http://orion:1026
      # Where Orion (not the api) reaches QuantumLeap
      - NOTIFY_URL=http://quantumleap:8668/v2/notify
      - CRATE_URL=http://crate-db:4200
      # Room the phone and the dashboard meet in to set up the camera stream (Settings > Web Controller)
      - VIDEO_ROOM_ID=${VIDEO_ROOM_ID:-OPTIMUS}
    ports:
      - "${API_PORT:-80}:8000"
    restart: unless-stopped

  # Context broker: holds the current state of each robot (NGSI v2)
  orion:
    image: fiware/orion:4.1.0
    container_name: optimus-orion
    depends_on:
      - mongo-db
    # One notification thread: QuantumLeap gets changes in order, one at a time. In parallel they race
    # to create the table's columns and some readings are lost.
    command: -dbURI mongodb://mongo-db -logLevel INFO -notificationMode threadpool:1000:1
    ports:
      - "127.0.0.1:1026:1026"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:1026/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Time series: stores every change Orion notifies into CrateDB
  quantumleap:
    image: orchestracities/quantumleap:1.0.0
    container_name: optimus-quantumleap
    depends_on:
      - crate-db
    environment:
      - CRATE_HOST=crate-db
      - LOGLEVEL=INFO
    ports:
      - "127.0.0.1:8668:8668"
    restart: unless-stopped

  mongo-db:
    image: mongo:6.0
    container_name: optimus-mongo
    volumes:
      - mongo-db:/data/db
    restart: unless-stopped

  crate-db:
    image: crate:5.10
    container_name: optimus-crate
    command: crate -Cauth.host_based.enabled=false -Ccluster.name=optimus -Cdiscovery.type=single-node
    environment:
      - CRATE_HEAP_SIZE=1g
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - crate-db:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: optimus-grafana
    depends_on:
      - crate-db
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  mongo-db: ~
  crate-db: ~
  grafana: ~
