[platformio]
; Build/upload button targets the robot; native is only for `pio test -e native`
default_envs = tbeam

[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
build_src_filter = +<openbot/>
test_ignore = *

[env:tbeam_keyboard]
extends = env:tbeam
build_src_filter = +<keyboard/>

[env:native]
platform = native
test_framework = unity
; Host has no Arduino core: never compile src/, tests pull in lib/ on their own
build_src_filter = -<*>
